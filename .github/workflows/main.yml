name: Build ProTether NX Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Clean Android Project
        run: |
          python3 - << 'PYEOF'
          import os

          def write_file(path, lines):
              os.makedirs(os.path.dirname(path) if os.path.dirname(path) else ".", exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write("\n".join(lines) + "\n")

          write_file("gradle.properties", [
              "android.useAndroidX=true",
              "android.enableJetifier=true",
              "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8"
          ])

          write_file("settings.gradle.kts", [
              "pluginManagement {",
              "    repositories {",
              "        google()",
              "        mavenCentral()",
              "        gradlePluginPortal()",
              "    }",
              "}",
              "dependencyResolutionManagement {",
              "    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)",
              "    repositories {",
              "        google()",
              "        mavenCentral()",
              "    }",
              "}",
              'rootProject.name = "ProTetherNX"',
              'include(":app")'
          ])

          write_file("build.gradle.kts", [
              "plugins {",
              '    id("com.android.application") version "8.2.2" apply false',
              '    id("org.jetbrains.kotlin.android") version "1.9.22" apply false',
              "}"
          ])

          write_file("app/build.gradle.kts", [
              "plugins {",
              '    id("com.android.application")',
              '    id("org.jetbrains.kotlin.android")',
              "}",
              "android {",
              '    namespace = "com.protether.nx"',
              "    compileSdk = 34",
              "    defaultConfig {",
              '        applicationId = "com.protether.nx"',
              "        minSdk = 26",
              "        targetSdk = 34",
              "        versionCode = 1",
              '        versionName = "1.0.0"',
              "    }",
              "    compileOptions {",
              "        sourceCompatibility = JavaVersion.VERSION_17",
              "        targetCompatibility = JavaVersion.VERSION_17",
              "    }",
              "    kotlinOptions {",
              '        jvmTarget = "17"',
              "    }",
              "    buildFeatures {",
              "        compose = true",
              "    }",
              "    composeOptions {",
              '        kotlinCompilerExtensionVersion = "1.5.8"',
              "    }",
              "}",
              "dependencies {",
              '    implementation("androidx.core:core-ktx:1.12.0")',
              '    implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")',
              '    implementation("androidx.activity:activity-compose:1.8.2")',
              '    implementation(platform("androidx.compose:compose-bom:2024.02.00"))',
              '    implementation("androidx.compose.ui:ui")',
              '    implementation("androidx.compose.ui:ui-graphics")',
              '    implementation("androidx.compose.material3:material3")',
              '    implementation("androidx.exifinterface:exifinterface:1.3.7")',
              '    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")',
              "}"
          ])

          write_file("app/src/main/AndroidManifest.xml", [
              '<?xml version="1.0" encoding="utf-8"?>',
              '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
              '    <uses-feature android:name="android.hardware.usb.host" android:required="true" />',
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
              '    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />',
              '    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />',
              '    <application',
              '        android:allowBackup="true"',
              '        android:label="ProTether NX"',
              '        android:supportsRtl="true"',
              '        android:theme="@android:style/Theme.DeviceDefault.NoActionBar">',
              '        <activity',
              '            android:name=".MainActivity"',
              '            android:exported="true"',
              '            android:screenOrientation="portrait"',
              '            android:launchMode="singleTop">',
              '            <intent-filter>',
              '                <action android:name="android.intent.action.MAIN" />',
              '                <category android:name="android.intent.category.LAUNCHER" />',
              '            </intent-filter>',
              '            <intent-filter>',
              '                <action android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED" />',
              '            </intent-filter>',
              '            <meta-data',
              '                android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED"',
              '                android:resource="@xml/device_filter" />',
              '        </activity>',
              '    </application>',
              '</manifest>'
          ])

          write_file("app/src/main/res/xml/device_filter.xml", [
              '<?xml version="1.0" encoding="utf-8"?>',
              '<resources>',
              '    <usb-device class="6" subclass="1" protocol="1" />',
              '    <usb-device vendor-id="1200" />',
              '    <usb-device vendor-id="1193" />',
              '</resources>'
          ])

          write_file("app/src/main/java/com/protether/nx/ptp/PtpConstants.kt", [
              "package com.protether.nx.ptp",
              "object PtpConstants {",
              "    const val OP_OPEN_SESSION: Short = 0x1002",
              "    const val OP_INITIATE_CAPTURE: Short = 0x100E",
              "    const val OP_SET_DEVICE_PROP_VALUE: Short = 0x1016",
              "    const val OP_NIKON_CHANGE_AF_AREA: Short = 0x9205.toShort()",
              "}"
          ])

          write_file("app/src/main/java/com/protether/nx/ptp/PtpUsbController.kt", [
              "package com.protether.nx.ptp",
              "import android.content.Context",
              "import android.hardware.usb.*",
              "import kotlinx.coroutines.Dispatchers",
              "import kotlinx.coroutines.withContext",
              "import java.nio.ByteBuffer",
              "import java.nio.ByteOrder",
              "data class CameraExifItem(",
              "    val objectHandle: Int,",
              "    val fileName: String,",
              "    val isRawNef: Boolean,",
              "    val shutterSpeed: String,",
              "    val aperture: String,",
              "    val iso: String,",
              "    val focalLength: String,",
              "    val fileSizeMb: Double",
              ")",
              "class PtpUsbController(context: Context) {",
              "    private val usbManager = context.getSystemService(Context.USB_SERVICE) as UsbManager",
              "    private var connection: UsbDeviceConnection? = null",
              "    private var usbInterface: UsbInterface? = null",
              "    private var endpointOut: UsbEndpoint? = null",
              "    private var transactionId = 1",
              "    suspend fun setTouchAfZone(zoneIndex: Int): Boolean = withContext(Dispatchers.IO) {",
              "        val x = (zoneIndex % 3) * 2000 + 1000",
              "        val y = (zoneIndex / 3) * 1300 + 650",
              "        sendPtpCommand(PtpConstants.OP_NIKON_CHANGE_AF_AREA, intArrayOf(x, y))",
              "    }",
              "    suspend fun triggerRemoteShutter(): Boolean = withContext(Dispatchers.IO) {",
              "        sendPtpCommand(PtpConstants.OP_INITIATE_CAPTURE, intArrayOf(0, 0))",
              "    }",
              "    private fun sendPtpCommand(opCode: Short, params: IntArray = intArrayOf()): Boolean {",
              "        val conn = connection ?: return false",
              "        val epOut = endpointOut ?: return false",
              "        val length = 12 + (params.size * 4)",
              "        val buffer = ByteBuffer.allocate(length).order(ByteOrder.LITTLE_ENDIAN)",
              "        buffer.putInt(length)",
              "        buffer.putShort(1)",
              "        buffer.putShort(opCode)",
              "        buffer.putInt(transactionId++)",
              "        params.forEach { buffer.putInt(it) }",
              "        val bytes = buffer.array()",
              "        return conn.bulkTransfer(epOut, bytes, bytes.size, 2500) >= 0",
              "    }",
              "    fun close() {",
              "        usbInterface?.let { connection?.releaseInterface(it) }",
              "        connection?.close()",
              "    }",
              "}"
          ])

          write_file("app/src/main/java/com/protether/nx/MainActivity.kt", [
              "package com.protether.nx",
              "import android.os.Bundle",
              "import androidx.activity.ComponentActivity",
              "import androidx.activity.compose.setContent",
              "import androidx.compose.foundation.background",
              "import androidx.compose.foundation.border",
              "import androidx.compose.foundation.clickable",
              "import androidx.compose.foundation.layout.*",
              "import androidx.compose.foundation.lazy.grid.GridCells",
              "import androidx.compose.foundation.lazy.grid.LazyVerticalGrid",
              "import androidx.compose.foundation.lazy.grid.items",
              "import androidx.compose.foundation.shape.CircleShape",
              "import androidx.compose.foundation.shape.RoundedCornerShape",
              "import androidx.compose.material3.*",
              "import androidx.compose.runtime.*",
              "import androidx.compose.ui.Alignment",
              "import androidx.compose.ui.Modifier",
              "import androidx.compose.ui.draw.clip",
              "import androidx.compose.ui.graphics.Color",
              "import androidx.compose.ui.text.font.FontWeight",
              "import androidx.compose.ui.unit.dp",
              "import androidx.compose.ui.unit.sp",
              "import com.protether.nx.ptp.CameraExifItem",
              "import com.protether.nx.ptp.PtpUsbController",
              "import kotlinx.coroutines.launch",
              "class MainActivity : ComponentActivity() {",
              "    private lateinit var ptpController: PtpUsbController",
              "    override fun onCreate(savedInstanceState: Bundle?) {",
              "        super.onCreate(savedInstanceState)",
              "        ptpController = PtpUsbController(this)",
              "        setContent {",
              "            MaterialTheme(colorScheme = darkColorScheme()) {",
              "                ProTetherAppScreen(ptpController)",
              "            }",
              "        }",
              "    }",
              "    override fun onDestroy() {",
              "        super.onDestroy()",
              "        ptpController.close()",
              "    }",
              "}",
              "@Composable",
              "fun ProTetherAppScreen(ptpController: PtpUsbController) {",
              "    val scope = rememberCoroutineScope()",
              "    var activeTab by remember { mutableIntStateOf(0) }",
              "    var autoTetherEnabled by remember { mutableStateOf(true) }",
              "    var selectedAfZone by remember { mutableIntStateOf(4) }",
              '    var statusLog by remember { mutableStateOf("Siap • Menunggu Kamera USB OTG / PTP-IP") }',
              '    val shutterValues = listOf("1/60", "1/125", "1/200", "1/400", "1/800", "1/1600")',
              '    val apertureValues = listOf("f/1.8", "f/2.8", "f/4.0", "f/5.6", "f/8.0")',
              '    val isoValues = listOf("100", "200", "400", "800", "1600", "3200")',
              '    val wbValues = listOf("3200K", "4500K", "5200K", "5600K", "6500K")',
              "    var shutterIdx by remember { mutableIntStateOf(2) }",
              "    var apertureIdx by remember { mutableIntStateOf(1) }",
              "    var isoIdx by remember { mutableIntStateOf(2) }",
              "    var wbIdx by remember { mutableIntStateOf(2) }",
              "    var mediaItems by remember {",
              "        mutableStateOf(",
              "            listOf(",
              '                CameraExifItem(101, "DSC_4821.NEF", true, "1/200s", "f/2.8", "ISO 400", "50mm", 29.4),',
              '                CameraExifItem(102, "DSC_4822.JPG", false, "1/200s", "f/2.8", "ISO 400", "50mm", 9.1),',
              '                CameraExifItem(103, "DSC_4823.NEF", true, "1/160s", "f/4.0", "ISO 200", "35mm", 30.2),',
              '                CameraExifItem(104, "DSC_4824.NEF", true, "1/250s", "f/2.8", "ISO 400", "70mm", 28.9)',
              "            )",
              "        )",
              "    }",
              "    Column(",
              "        modifier = Modifier.fillMaxSize().background(Color(0xFF0B0E14)).padding(14.dp)",
              "    ) {",
              "        Row(",
              "            modifier = Modifier.fillMaxWidth(),",
              "            horizontalArrangement = Arrangement.SpaceBetween,",
              "            verticalAlignment = Alignment.CenterVertically",
              "        ) {",
              "            Column {",
              '                Text("ProTether NX", color = Color.White, fontWeight = FontWeight.Bold, fontSize = 18.sp)',
              "                Text(statusLog, color = Color(0xFF34D399), fontSize = 11.sp)",
              "            }",
              "            Button(onClick = { autoTetherEnabled = !autoTetherEnabled }) {",
              '                Text(if (autoTetherEnabled) "Auto-Tether: ON" else "Auto-Tether: OFF", fontSize = 11.sp)',
              "            }",
              "        }",
              "        Spacer(modifier = Modifier.height(10.dp))",
              "        Box(modifier = Modifier.weight(1f)) {",
              "            when (activeTab) {",
              "                0 -> {",
              "                    Column(modifier = Modifier.fillMaxSize()) {",
              "                        Column(",
              "                            modifier = Modifier.fillMaxWidth().weight
